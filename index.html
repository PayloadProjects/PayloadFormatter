<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fast, private JSON and XML formatter that runs entirely in your browser." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#11161d" />
    <link rel="icon" type="image/png" sizes="32x32" href="./json-xml-formatter-icon.png?v=4" />
    <link rel="shortcut icon" type="image/png" href="./json-xml-formatter-icon.png?v=4" />
    <script>
      (() => {
        const storageKey = 'payload-formatter:theme:v1';
        let theme = 'dark';
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          }
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>JSON/XML Formatter</title>
    <link rel="stylesheet" href="./style.css?v=large-preview-20261002-1" />
    <link rel="stylesheet" href="./tree-view.css?v=tree-view-20261002-1" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
          <div class="brand-copy">
            <h1>JSON/XML Formatter</h1>
            <span class="brand-subtitle">Fast formatting. Nothing leaves your browser.</span>
          </div>
        </div>

        <button
          id="themeToggleBtn"
          class="theme-toggle"
          type="button"
          aria-label="Switch to light mode"
          title="Switch to light mode"
        >
          <span id="themeIcon" class="theme-icon" aria-hidden="true">☀</span>
          <span id="themeLabel">Light mode</span>
        </button>
      </header>

      <section class="workspace" aria-label="JSON/XML formatter">
        <div id="editorFrame" class="editor-frame" data-view="text">
          <div class="editor-strip">
            <div class="editor-strip-left">
              <span class="editor-label">Payload</span>
              <div class="view-toggle" role="group" aria-label="Payload view">
                <button id="viewTextBtn" type="button" aria-pressed="true">Text</button>
                <button id="viewTreeBtn" type="button" aria-pressed="false">Tree</button>
              </div>
            </div>
            <div class="editor-strip-meta">
              <span class="privacy-dot" aria-hidden="true"></span>
              <span class="local-label">Local only</span>
              <span id="typeBadge" class="type-badge" aria-live="polite">Waiting for payload</span>
            </div>
          </div>

          <div id="largeNotice" class="large-notice" role="status" hidden></div>

          <textarea
            id="payloadInput"
            class="editor"
            spellcheck="false"
            wrap="off"
            autocapitalize="off"
            autocomplete="off"
            placeholder="Paste JSON or XML here..."
            aria-label="JSON or XML payload"
          ></textarea>

          <div id="treePanel" class="tree-panel">
            <div class="tree-tools">
              <input
                id="treeSearch"
                class="tree-search"
                type="search"
                placeholder="Search keys and values…"
                aria-label="Search the tree"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="treePrev" type="button" title="Previous match" aria-label="Previous tree search match">↑</button>
              <button id="treeNext" type="button" title="Next match" aria-label="Next tree search match">↓</button>
              <span id="treeMatchCount" class="tree-match-count" aria-live="polite"></span>
              <span class="tree-tools-spacer"></span>
              <button id="treeExpandAll" type="button">Expand all</button>
              <button id="treeCollapseAll" type="button">Collapse all</button>
            </div>
            <div id="treeView" class="tree-view" tabindex="-1"></div>
          </div>
        </div>

        <div class="toolbar">
          <div class="actions" role="group" aria-label="Formatting actions">
            <button id="clearBtn" class="danger" type="button">Clear</button>
            <button id="pasteFormatBtn" class="primary" type="button">Paste &amp; Format</button>
            <button id="copyBtn" type="button">Copy</button>
          </div>

          <div class="status-area">
            <span id="statusText" role="status" aria-live="polite">Ready.</span>
            <span class="status-divider" aria-hidden="true"></span>
            <span id="metaText" class="meta-text">0 lines · 0 B</span>
          </div>
        </div>

        <div class="workspace-note">
          <span>Draft stays in this tab across refresh.</span>
          <span>Ctrl/Cmd + Enter to format.</span>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js?v=tree-view-20261002-1"></script>
  </body>
</html>
