<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fast, private JSON and XML formatter that runs entirely in your browser." />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        const storageKey = 'payload-formatter:theme:v1';
        let theme = 'dark';
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          }
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>JSON/XML Formatter</title>
    <link rel="stylesheet" href="./style.css?v=theme-20260920-2" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="title-row">
            <h1>JSON/XML Formatter</h1>
            <span class="privacy-pill">Runs locally</span>
          </div>
          <p>Paste JSON or XML. The formatter detects the payload type automatically.</p>
        </div>
        <div class="topbar-controls">
          <button id="themeToggleBtn" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
            <span id="themeIcon" class="theme-icon" aria-hidden="true">☀</span>
            <span id="themeLabel">Light mode</span>
          </button>
          <span id="typeBadge" class="type-badge" aria-live="polite">Waiting for payload</span>
        </div>
      </header>

      <section class="card workspace" aria-label="JSON/XML formatter">
        <div class="toolbar">
          <div class="actions" role="group" aria-label="Formatting actions">
            <button id="clearBtn" class="danger" type="button">Clear</button>
            <button id="pasteBtn" type="button">Paste</button>
            <button id="formatBtn" class="primary" type="button">Format</button>
            <button id="copyBtn" type="button">Copy</button>
          </div>
          <div class="status-area">
            <span id="statusText" role="status" aria-live="polite">Ready.</span>
          </div>
        </div>

        <textarea
          id="payloadInput"
          class="editor"
          spellcheck="false"
          wrap="off"
          autocapitalize="off"
          autocomplete="off"
          placeholder="Paste JSON or XML here..."
          aria-label="JSON or XML payload"
        ></textarea>

        <div class="meta-row" aria-live="polite">
          <span id="metaText">0 lines · 0 B</span>
          <span>Draft stays in this tab across refresh.</span>
        </div>
      </section>

      <footer>Nothing is uploaded by this page. Formatting happens in your browser.</footer>
    </main>

    <script type="module" src="./app.js?v=theme-20260920-2"></script>
  </body>
</html>
