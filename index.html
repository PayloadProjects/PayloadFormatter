<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fast, private JSON and XML formatter that runs entirely in your browser." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#11161d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1" />
    <link rel="shortcut icon" href="./favicon.svg?v=1" />
    <script>
      (() => {
        const storageKey = 'payload-formatter:theme:v1';
        let theme = 'dark';
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          }
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>JSON/XML Formatter</title>
    <link rel="stylesheet" href="./style.css?v=identity-20260920-1" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
          <div class="brand-copy">
            <h1>JSON/XML Formatter</h1>
            <span class="brand-subtitle">Fast formatting. Nothing leaves your browser.</span>
          </div>
        </div>

        <button
          id="themeToggleBtn"
          class="theme-toggle"
          type="button"
          aria-label="Switch to light mode"
          title="Switch to light mode"
        >
          <span id="themeIcon" class="theme-icon" aria-hidden="true">☀</span>
          <span id="themeLabel">Light mode</span>
        </button>
      </header>

      <section class="workspace" aria-label="JSON/XML formatter">
        <div class="editor-frame">
          <div class="editor-strip">
            <span class="editor-label">Payload</span>
            <div class="editor-strip-meta">
              <span class="privacy-dot" aria-hidden="true"></span>
              <span class="local-label">Local only</span>
              <span id="typeBadge" class="type-badge" aria-live="polite">Waiting for payload</span>
            </div>
          </div>

          <textarea
            id="payloadInput"
            class="editor"
            spellcheck="false"
            wrap="off"
            autocapitalize="off"
            autocomplete="off"
            placeholder="Paste JSON or XML here..."
            aria-label="JSON or XML payload"
          ></textarea>
        </div>

        <div class="toolbar">
          <div class="actions" role="group" aria-label="Formatting actions">
            <button id="clearBtn" class="danger" type="button">Clear</button>
            <button id="pasteBtn" type="button">Paste</button>
            <button id="formatBtn" class="primary" type="button">Format</button>
            <button id="copyBtn" type="button">Copy</button>
          </div>

          <div class="status-area">
            <span id="statusText" role="status" aria-live="polite">Ready.</span>
            <span class="status-divider" aria-hidden="true"></span>
            <span id="metaText" class="meta-text">0 lines · 0 B</span>
          </div>
        </div>

        <div class="workspace-note">
          <span>Draft stays in this tab across refresh.</span>
          <span>Ctrl/Cmd + Enter to format.</span>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js?v=reliability-20260920-1"></script>
  </body>
</html>
